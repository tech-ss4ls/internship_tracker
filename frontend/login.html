<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        
        <link rel="stylesheet" href="../CSS/style.css">
    </head>
    <body>
       <div class="auth-container">
            <h2>Login to Continue</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </form>
            <div id="message"></div>
        </div>
        
        <script src="scripts/auth.js"></script>
        <script>
            // Also redirect to index if already logged in
            (function() {
                const token = localStorage.getItem('authToken');
                if (token) {
                    // Optionally verify token with backend
                    fetch(`${API_URL}/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                    .then(res => {
                        if (res.ok) {
                            window.location.href = 'index.html';
                        }
                    })
                    .catch(() => { /* Stay on login page */ });
                }
            })();

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'session_expired'){
                document.getElementById('message'),innerHTML = '<p style="color: orange;"> Session expired . Please lognin again.</p>';
            }
        </script>
    </body>
</html>
